name: Deploy Baden Forecast Channel data

on:
  push:
    branches: [main]
  schedule:
    # Check frequently because GitHub may delay or drop individual cron events.
    # Backup checks also prepare at :50/:55 if the Cloudflare trigger is late.
    # A ready artifact is held until its planned :00 release boundary.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      publish_at:
        description: "Optional planned publication time (Unix seconds, UTC hour boundary)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Let an active refresh finish. A queued check will then see the new file and
  # skip instead of cancelling a valid deployment near the end of its run.
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.check.outputs.refresh }}
    steps:
      - name: Check live forecast age
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          LIVE_FORECAST_URL: https://b7.185.199.108.153.nip.io/1/108/f.bin
        shell: bash
        run: |
          # Pushes/manual runs generate a complete artifact. Backup checks
          # prepare in the last ten minutes of the hour, or repair old files.
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          minute="$(date -u +%M)"
          if (( 10#$minute >= 50 )); then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          headers="$(curl --fail --silent --show-error --head --max-time 15 \
            "${LIVE_FORECAST_URL}?freshness=${GITHUB_RUN_ID}" || true)"
          last_modified="$(printf '%s\n' "$headers" | tr -d '\r' | \
            awk -F': ' 'tolower($1) == "last-modified" { print $2; exit }')"

          if [[ -z "$last_modified" ]]; then
            echo "Could not read the live timestamp; refreshing defensively."
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          modified_epoch="$(date --date="$last_modified" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - modified_epoch))"
          echo "Live forecast age: ${age_seconds} seconds"

          if (( age_seconds >= 3000 )); then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: freshness
    if: needs.freshness.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Plan publication hour
        id: plan
        env:
          REQUESTED_PUBLISH_AT: ${{ inputs.publish_at }}
        run: python3 scripts/publication.py plan
      - name: Install forecast signing key
        env:
          FORECAST_PRIVATE_KEY: ${{ secrets.FORECAST_PRIVATE_KEY }}
        run: printf '%s' "$FORECAST_PRIVATE_KEY" > Private.pem
      - name: Generate Switzerland forecast data
        env:
          FORECAST_VALID_FROM: ${{ steps.plan.outputs.publish_at }}
        run: |
          cp config-example.xml config.xml
          go build -buildvcs=false -o ForecastGenerator .
          ./ForecastGenerator
          find files -type f -name forecast.bin -execdir cp forecast.bin f.bin \;
          find files -type f -name short.bin -execdir cp short.bin s.bin \;
      - name: Validate generated data
        run: |
          go test ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: files
      - name: Hold prepared artifact until the hour
        env:
          PUBLISH_AT: ${{ steps.plan.outputs.publish_at }}
        run: python3 -u scripts/publication.py wait
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
