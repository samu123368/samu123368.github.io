name: Deploy Baden Forecast Channel data

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Install forecast signing key
        env:
          FORECAST_PRIVATE_KEY: ${{ secrets.FORECAST_PRIVATE_KEY }}
        run: printf '%s' "$FORECAST_PRIVATE_KEY" > Private.pem
      - name: Generate Switzerland forecast data
        run: |
          cp config-example.xml config.xml
          go build -buildvcs=false -o ForecastGenerator .
          ./ForecastGenerator
          find files -type f -name forecast.bin -execdir cp forecast.bin f.bin \;
          find files -type f -name short.bin -execdir cp short.bin s.bin \;
      - name: Validate generated data
        run: go test ./...
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: files
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
